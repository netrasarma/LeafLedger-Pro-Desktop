<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaf Ledger Pro — Software Update</title>
<style>
  :root {
    --bg:              #0a100d;
    --surface:         #111c16;
    --border:          #1b2e24;
    --primary:         #10b981;
    --primary-glow:    rgba(16, 185, 129, 0.4);
    --accent:          #059669;
    --text:            #f1f5f9;
    --text-dim:        #94a3b8;
    --text-muted:      #64748b;
    --heading:         #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .update-container {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--surface) 0%, #080e0a 100%);
    border: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .update-container::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 130px;
    height: 130px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(0,0,0,0) 70%);
    z-index: 0;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1;
  }

  .app-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 16px var(--primary-glow);
  }

  .title-area {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--heading);
    letter-spacing: -0.2px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .body-area {
    z-index: 1;
    margin: 16px 0;
  }

  .progress-track {
    width: 100%;
    height: 7px;
    background: #0d1712;
    border: 1px solid var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 99px;
    box-shadow: 0 0 10px var(--primary-glow);
    transition: width 0.15s ease-out;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 500;
  }

  .status-text {
    color: var(--text-dim);
  }

  .percent-text {
    color: var(--primary);
    font-weight: 700;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    color: var(--text-muted);
    border-top: 1px solid rgba(27, 46, 36, 0.6);
    padding-top: 10px;
    z-index: 1;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--primary);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.5s infinite;
    margin-right: 5px;
    vertical-align: middle;
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.9); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
</style>
</head>
<body>

<div class="update-container">
  <div class="header">
    <div class="app-icon">🌿</div>
    <div class="title-area">
      <h1>Leaf Ledger Pro</h1>
      <span class="subtitle" id="version-label">Downloading software update...</span>
    </div>
  </div>

  <div class="body-area">
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="status-row">
      <span class="status-text" id="status-text">Connecting to update server...</span>
      <span class="percent-text" id="percent-text">0%</span>
    </div>
  </div>

  <div class="footer">
    <span><span class="pulse-dot"></span>Please keep the application open during download.</span>
    <span id="speed-text">-- MB / -- MB</span>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const version = urlParams.get('version');
  if (version) {
    document.getElementById('version-label').innerText = `Downloading version v${version}...`;
  }

  if (window.electronAPI && window.electronAPI.updater) {
    window.electronAPI.updater.onUpdateProgress((data) => {
      if (!data) return;
      const percent = Math.min(Math.max(Math.round(data.percent || 0), 0), 100);
      
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('percent-text').innerText = `${percent}%`;
      
      if (percent < 100) {
        document.getElementById('status-text').innerText = `Downloading package files...`;
      } else {
        document.getElementById('status-text').innerText = `Verifying and preparing installation...`;
      }
      
      const downloadedStr = (data.downloadedMB || 0).toFixed(1);
      const totalStr = (data.totalMB || 0) > 0 ? `${(data.totalMB).toFixed(1)} MB` : '-- MB';
      document.getElementById('speed-text').innerText = `${downloadedStr} MB / ${totalStr}`;
    });
  }
</script>

</body>
</html>
