<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Ledger Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #040806;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(45, 138, 88, 0.35);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.95), 0 0 40px rgba(34, 197, 94, 0.15);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .splash-container.fading-out {
      opacity: 0;
      transform: scale(0.98);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    /* Glassmorphic skip button */
    .skip-btn {
      position: absolute;
      bottom: 22px;
      right: 22px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .skip-btn.visible {
      opacity: 0.85;
      transform: translateY(0);
    }

    .skip-btn:hover {
      opacity: 1;
      background: rgba(45, 138, 88, 0.75);
      border-color: rgba(74, 222, 128, 0.4);
      color: #ffffff;
      transform: scale(1.04);
    }

    /* Audio toggle button */
    .audio-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 14px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.75;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .audio-btn:hover {
      opacity: 1;
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(74, 222, 128, 0.35);
      transform: scale(1.06);
    }

    /* Ambient glow at bottom */
    .ambient-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to top, rgba(4, 8, 6, 0.6), transparent);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="container" class="splash-container">
    <video id="splashVideo" src="video.mp4" playsinline preload="auto"></video>
    
    <button id="audioToggle" class="audio-btn" title="Toggle Sound">🔊</button>
    <button id="skipBtn" class="skip-btn" title="Skip Intro (Esc or Space)">
      <span>Skip</span>
      <span style="opacity: 0.6; font-size: 10px;">(Esc)</span>
      <span>➔</span>
    </button>
    <div class="ambient-glow"></div>
  </div>

  <script>
    const video = document.getElementById('splashVideo');
    const container = document.getElementById('container');
    const skipBtn = document.getElementById('skipBtn');
    const audioToggle = document.getElementById('audioToggle');

    let finished = false;

    // Set initial audio volume
    video.volume = 0.75;

    // Show skip button gently after 1 second
    setTimeout(() => {
      skipBtn.classList.add('visible');
    }, 1000);

    function finishSplash() {
      if (finished) return;
      finished = true;
      container.classList.add('fading-out');
      setTimeout(() => {
        if (window.electronAPI?.splash?.finish) {
          window.electronAPI.splash.finish();
        }
      }, 350);
    }

    // Video events
    video.addEventListener('ended', finishSplash);
    video.addEventListener('error', finishSplash);

    // Audio toggle
    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      audioToggle.innerText = video.muted ? '🔇' : '🔊';
    });

    // Skip clicks
    skipBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      finishSplash();
    });

    // Click anywhere on video to skip
    video.addEventListener('click', finishSplash);

    // Keyboard controls (Esc, Space, Enter)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
        finishSplash();
      }
    });

    // Autoplay start
    video.play().catch(() => {
      // If browser prevents unmuted autoplay, mute and play
      video.muted = true;
      audioToggle.innerText = '🔇';
      video.play().catch(finishSplash);
    });

    // Failsafe timer (8s)
    setTimeout(finishSplash, 8000);
  </script>
</body>
</html>
