<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaf Ledger Pro — Updating</title>
<style>
  :root {
    --bg-dark:         #070d0a;
    --card-surface:    #0e1913;
    --border-glow:     rgba(52, 211, 153, 0.25);
    --border-subtle:   rgba(255, 255, 255, 0.08);
    --primary:         #10b981;
    --primary-light:   #34d399;
    --primary-glow:    rgba(16, 185, 129, 0.45);
    --text-main:       #f8fafc;
    --text-muted:      #94a3b8;
    --text-dim:        #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    padding: 10px;
  }

  .update-card {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.18) 0%, rgba(11, 20, 15, 0.98) 65%), #080f0b;
    border: 1px solid var(--border-glow);
    border-radius: 18px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 30px rgba(16, 185, 129, 0.12);
    -webkit-app-region: drag;
  }

  /* Ambient corner flare */
  .update-card::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(52, 211, 153, 0.22) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none;
  }

  /* Header Section */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .app-icon-squircle {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px var(--primary-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }

  .title-group {
    display: flex;
    flex-direction: column;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.2px;
  }

  .version-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(16, 185, 129, 0.18);
    color: #34d399;
    border: 1px solid rgba(52, 211, 153, 0.35);
    letter-spacing: 0.2px;
  }

  .app-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 3px;
    font-weight: 500;
  }

  .header-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--primary-light);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .pulse-indicator {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
    animation: livePulse 1.6s infinite ease-in-out;
  }

  @keyframes livePulse {
    0%   { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70%  { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* Body / Progress Section */
  .body-section {
    z-index: 1;
    margin: 12px 0 8px;
  }

  .progress-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .status-label {
    color: var(--text-muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .metrics-cluster {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bytes-pill {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    color: #cbd5e1;
    background: rgba(255, 255, 255, 0.06);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .percent-badge {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 13px;
    font-weight: 800;
    color: var(--primary-light);
    min-width: 38px;
    text-align: right;
  }

  /* Modern Glowing Progress Track */
  .progress-track {
    width: 100%;
    height: 9px;
    background: rgba(13, 24, 18, 0.9);
    border: 1px solid rgba(52, 211, 153, 0.2);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #10b981 0%, #34d399 75%, #a7f3d0 100%);
    border-radius: 99px;
    box-shadow: 0 0 14px var(--primary-glow);
    transition: width 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  /* Shimmer shine over progress bar */
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.35) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: translateX(-100%);
    animation: shimmer 1.8s infinite;
  }

  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }

  /* Footer Notice */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 10px;
    z-index: 1;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
  }

  .footer-right {
    font-weight: 600;
    color: var(--primary-light);
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="update-card">
  <!-- Top Header -->
  <div class="header">
    <div class="header-left">
      <div class="app-icon-squircle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="title-group">
        <div class="title-row">
          <span class="app-title">Leaf Ledger Pro</span>
          <span class="version-tag" id="version-tag">v1.0.4</span>
        </div>
        <span class="app-subtitle" id="version-label">Downloading latest update...</span>
      </div>
    </div>

    <div class="header-badge">
      <span class="pulse-indicator"></span>
      <span id="badge-label">UPDATING</span>
    </div>
  </div>

  <!-- Progress Area -->
  <div class="body-section">
    <div class="progress-info-row">
      <span class="status-label" id="status-text">
        <span>Connecting to update server...</span>
      </span>
      <div class="metrics-cluster">
        <span class="bytes-pill" id="speed-text">0.0 MB / -- MB</span>
        <span class="percent-badge" id="percent-text">0%</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- Footer Notice -->
  <div class="footer">
    <div class="footer-left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #34d399;">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Please keep Leaf Ledger Pro open during download</span>
    </div>
    <span class="footer-right" id="footer-right">Auto-installs on finish</span>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const version = urlParams.get('version');
  if (version) {
    document.getElementById('version-tag').innerText = `v${version}`;
    document.getElementById('version-label').innerText = `Downloading official release v${version}...`;
  }

  if (window.electronAPI && window.electronAPI.updater) {
    window.electronAPI.updater.onUpdateProgress((data) => {
      if (!data) return;
      const percent = Math.min(Math.max(Math.round(data.percent || 0), 0), 100);
      
      const barEl = document.getElementById('progress-bar');
      const percentEl = document.getElementById('percent-text');
      const statusEl = document.getElementById('status-text');
      const speedEl = document.getElementById('speed-text');
      const badgeEl = document.getElementById('badge-label');
      const footerRight = document.getElementById('footer-right');

      if (barEl) barEl.style.width = `${percent}%`;
      if (percentEl) percentEl.innerText = `${percent}%`;
      
      if (percent < 100) {
        if (statusEl) statusEl.innerText = `Downloading package files...`;
        if (badgeEl) badgeEl.innerText = `DOWNLOADING`;
      } else {
        if (statusEl) statusEl.innerText = `✨ Package verified! Launching installer...`;
        if (badgeEl) badgeEl.innerText = `INSTALLING`;
        if (footerRight) footerRight.innerText = `Restarting app...`;
      }
      
      const downloadedStr = (data.downloadedMB || 0).toFixed(1);
      const totalStr = (data.totalMB || 0) > 0 ? `${(data.totalMB).toFixed(1)} MB` : '-- MB';
      if (speedEl) speedEl.innerText = `${downloadedStr} MB / ${totalStr}`;
    });
  }
</script>

</body>
</html>
