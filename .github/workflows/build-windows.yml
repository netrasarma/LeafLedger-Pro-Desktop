name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'          # Trigger on version tags like v2.0.8, v2.1.0
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  build-windows:
    name: Build & Sign Windows .exe Installer
    runs-on: windows-latest
    permissions:
      contents: write   # Required to create GitHub Releases and upload assets

    steps:
      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python for Certificate Generation ────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Cryptography
        run: pip install cryptography
        shell: pwsh

      # ── 3. Set up Node.js 20 ───────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install Node dependencies ───────────────────────────────────────
      - name: Install Dependencies
        run: npm install
        shell: pwsh

      # ── 5. Generate Dynamic Cyclic XOR Secrets ────────────────────────────
      - name: Generate Dynamic XOR Secrets
        run: node scripts/generate_secrets.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_UPDATER_TOKEN: ${{ secrets.GITHUB_UPDATER_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh

      # ── 6. Generate Two-Tier X.509 Code Signing Certificates ───────────────
      - name: Generate Code Signing Certificates
        run: python scripts/generate_cert.py
        env:
          PYTHONUTF8: "1"
        shell: pwsh

      # ── 7. Build Hardened Installer with Electron Fuses & ASAR Integrity ───
      - name: Build & Sign Electron Windows Installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: leaf_ledger_codesign.pfx
          WIN_CSC_KEY_PASSWORD: leafledger2026
        shell: pwsh

      # ── 8. Upload Installer Artifact (Optional fallback) ───────────────────
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LeafLedgerPro-Windows-Installer
          path: |
            release/*.exe
            leaf_ledger_root_ca.cer
            scripts/install_cert.bat
          retention-days: 7
          if-no-files-found: ignore

      # ── 9. Publish to GitHub Releases (on tags or dispatch) ───────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Leaf Ledger Pro Desktop ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            leaf_ledger_root_ca.cer
            scripts/install_cert.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
