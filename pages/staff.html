<section id="view-staff" class="view-page active">
  <div class="page-header">
    <div class="page-title-group">
      <h1>Staff & Mobile Collectors</h1>
      <p>Authorize weighbridge staff and field collectors with secure MPIN credentials</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" onclick="staffModule.openNewModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Staff Collector
      </button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Username / ID</th>
            <th>Mobile Number</th>
            <th>Collector Access</th>
            <th>Status</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="staffTableBody">
          <tr><td colspan="6" style="text-align: center; padding: 24px;">No additional staff configured. Master Admin active.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
