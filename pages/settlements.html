<section id="view-settlements" class="view-page active">
  <div class="page-header">
    <div class="page-title-group">
      <h1>Monthly Settlements & Payroll Engine</h1>
      <p>Compute final planter payouts, apply monthly green leaf rates, and settle advances</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-secondary" onclick="settlementsModule.exportCsv()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Payroll CSV
      </button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-toolbar" style="flex-wrap: wrap; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Month / Year:</label>
        <select id="settleMonthSelect" class="form-select" style="width: 140px;" onchange="settlementsModule.load()">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
        <select id="settleYearSelect" class="form-select" style="width: 100px;" onchange="settlementsModule.load()">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Uniform Rate (₹/KG):</label>
        <input type="number" step="0.1" id="settleUniformRate" class="form-input mono" placeholder="e.g. 18.50" style="width: 120px;" oninput="settlementsModule.load()">
      </div>

      <button class="btn btn-primary btn-sm" onclick="settlementsModule.applyRate()">Apply Rate to All</button>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Planter</th>
            <th>Net Weight (KG)</th>
            <th>Rate / KG</th>
            <th>Gross Amount</th>
            <th>Deducted Advances</th>
            <th>Net Payable</th>
            <th>Status</th>
            <th style="text-align: right;">Passbook</th>
          </tr>
        </thead>
        <tbody id="settlementsTableBody">
          <tr><td colspan="8" style="text-align: center; padding: 24px;">Select month and year to view settlement sheet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
